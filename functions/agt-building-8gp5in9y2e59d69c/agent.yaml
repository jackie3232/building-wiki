# ============================================================================
# BUILDING.WIKI · OAK Agent 配置（MVP 2.0）
# ----------------------------------------------------------------------------
# 本文件是写入 Agent 函数 agt-building-8gp5in9y2e59d69c 的 agent.yaml 的内容，
# 用于把本仓库的 MCP Server（/mcp 端点）挂进 OAK Agent。
#
# 落地方式（官方推荐）：agent.yaml 随代码包部署，运行时读 /var/user/agent.yaml。
#   tcb agent update <agentId> --code <dir>       # 或 tcb fn code update <函数名> --dir <dir>
# ⚠️ 部署为云函数写操作，必须用户逐条明确授权，AI 不得自行推送。
#
# 关键约束（来自官方文档 + 运行时真码实测）：
#   1. mcp_servers[].type 只认 "url"（远程 HTTP MCP）；其它值静默忽略。
#   2. mcp_servers 与 tools 必须成对：server 声明了但 tools 没挂 mcp_toolset，不会被调用。
#   3. 工具在 Agent 侧命名为 mcp__{serverName}__{toolName}
#      （即 mcp__building-wiki__ping / __generate_building）。
#   4. 端点必须为 https 公网可达。
#   5. tools[].default_config.permission_policy 必须嵌在 default_config **里面**
#      （真码：dist/oak-runtime/config.js 读 t.default_config?.permission_policy?.type）。
#   6. 配置优先级：AGENT_CONFIG/AGENT_CONFIG_B64 env > agent.yaml > AGENT_NAME/MODEL/SYSTEM。
#   7. system: 是**替换**（不是追加）默认系统提示词 —— 真码 dist/oak-runtime/config.js:
#        systemPrompt: config.system
#      默认提示词里没有任何 skill / 骨架 schema / 装配器的信息，所以这里必须显式指路，
#      否则模型完全不知道有装配器存在（实测：会拿手写骨架直接喂几何工具
#      —— 当时叫 compute_geometry，现为 generate_building —— 拿到空结果后反复盲试 15 分钟）。
#      真源仍只有一份：schema 与流程只写在 skill 的 SKILL.md 里；system: 承载「人设 + 指路」，不重复流程细节。
#   8. skill 会被递归物化到 **cwd 下** .claude/skills/<name>/（含 assemble.mjs）。
#      知识包不再随函数打包：运行时 assemble 按 cos:packs/manifest.json 从 COS 拉取
#      （见 SKILL.md「运行时拉取」），知识更新只发 COS、不 redeploy 函数。
#      真码 dist/managed/skills.js（copyDirRecursive）+ dist/oak-runtime/workspace.js
#      （OAK_WORKSPACE_CWD = "/tmp/workspace"，SCF/TCBR 一致）→ 路径确定，故用绝对路径。
# ============================================================================

name: oma
model: hy3
runtime: managed
system: |
  你是「中国传统建筑专家」，能把用户对中式建筑的自然语言描述
  （当前支持四合院）转成三维体素模型。

  【工作方式】你的专业手册是技能目录下的 SKILL.md
  （/tmp/workspace/.claude/skills/traditional-building/SKILL.md）。
  开工前必须先读它——它是骨架格式、角色词表、装配流程的唯一事实源，
  不要凭记忆猜。若该路径不存在，先定位：
    find /tmp/workspace -name SKILL.md -path '*traditional-building*'
  确实读不到，如实报告并停下，不要猜。

  【准则】
  - 不碰坐标与几何量：坐标、朝向、镜像，以及「由尺寸推坐标」的运算，
    一律不写、不算。
  - 角色名只取知识包词表里的 key，不自造、不写中文别名。
  - 风格由你从用户话术推断，写进骨架的 style 字段；具体风格差异
    全在知识包里，你本身不写死任何风格事实。
  - 手册没写的流程，不要自己发明。

  【分工】你负责：理解 + 装配 + 上传，然后把结果交给生成工具；
  前端负责渲染。坐标与体素计算在服务端完成，你只传引用、收结果。

mcp_servers:
  - name: building-wiki
    type: url
    # Cloud Run 服务域名（服务名 building-wiki；新环境 building-wiki-2-d8frzgtn5b631969）
    # /mcp 与 /mcp/ 均可直连（/mcp 会 307 重定向到 /mcp/）。域名只跟服务名走。
    url: https://building-wiki-323919-10-1258039591.sh.run.tcloudbase.com/mcp

tools:
  - type: mcp_toolset
    mcp_server_name: building-wiki
    default_config:
      enabled: true
      # ⚠️ permission_policy 必须在 default_config **里面**。
      # 依据运行时真码 node_modules/open-managed-agent-runtime-shared/dist/config.js
      # （由 dist/oak-runtime/config.js 消费）：
      #   const defaultAsk = t.default_config?.permission_policy?.type === "always_ask";
      # 写成 default_config 的兄弟节点会被**静默忽略**。
      permission_policy:
        type: always_allow    # 免确认直接调用（也可改 always_ask 每步确认）
